[build-system]
requires = ["setuptools>=61", "wheel", "torch>=1.8"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-gnn"
version = "0.1.0"
description = "PyTorch Extension Library of Optimized Graph Neural Network Algorithms"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["license"]
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=1.8",
]
keywords = [
    "pytorch",
    "geometric-deep-learning",
    "graph-neural-networks",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:`torch\.jit\.script_method` is deprecated\..*:DeprecationWarning',
]

[tool.cibuildwheel]
test-command = "python -c \"import ops_gnn; print(ops_gnn.greet('World'))\""
